name: CI/CD → Build & Deploy to AWS ECS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]       # runs tests only on PRs, no deploy

# Prevent concurrent deploys to the same environment
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION:        us-east-2                          # ← your RDS region
  ECR_REPOSITORY:    raks/backms                      # ← your ECR repo name
  ECS_CLUSTER:       dolphin-raks-backms1                    # ← your ECS cluster name
  ECS_SERVICE:       raks-orderms-service-y7gz6kk8        # ← your ECS service name
  CONTAINER_NAME:    raks-orderms-service                      # ← container name in task definition
  TASK_DEFINITION:   raks-orderms                   # ← your ECS task definition family name

jobs:
  # ──────────────────────────────────────────
  # JOB 1 — Test
  # ──────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn test -B

  # ──────────────────────────────────────────
  # JOB 2 — Build & Deploy (main branch only)
  # ──────────────────────────────────────────
  deploy:
    name: Build Image & Deploy to ECS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Step 1: Authenticate with AWS ───────────────────────────────────────
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381155823218:role/github-actions-role-raks
          aws-region: ${{ env.AWS_REGION }}

      # ── Step 2: Build JAR ────────────────────────────────────────────────────
      - name: Build JAR with Maven
        run: mvn clean package -DskipTests -B

      # ── Step 3: Login to Amazon ECR ─────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Step 4: Build, tag, and push Docker image to ECR ────────────────────
      - name: Build, tag & push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ── Step 5: Download current task definition ─────────────────────────────
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
          --task-definition ${{ env.TASK_DEFINITION }} \
          --query taskDefinition \
          > task-definition.json

      # ── Step 6: Render new task definition with updated image ────────────────
      - name: Render new task definition with updated image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # ── Step 7: Deploy new task definition to ECS ────────────────────────────
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true