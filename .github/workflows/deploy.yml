name: CI/CD → Build & Deploy to AWS ECS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]       # runs tests only on PRs, no deploy

# Prevent concurrent deploys to the same environment
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION:        us-east-2                          # ← your RDS region
  ECR_REPOSITORY:    raks/backms                      # ← your ECR repo name
  ECS_CLUSTER:       dolphin-raks-backms1                    # ← your ECS cluster name
  ECS_SERVICE:       order-service-svc                  # ← your ECS service name
  CONTAINER_NAME:    order-service                      # ← container name in task definition
  TASK_DEFINITION:   order-service-td                   # ← your ECS task definition family name

jobs:
  # ──────────────────────────────────────────
  # JOB 1 — Test
  # ──────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn test -B

  # ──────────────────────────────────────────
  # JOB 2 — Build & Deploy (main branch only)
  # ──────────────────────────────────────────
  deploy:
    name: Build Image & Deploy to ECS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Step 1: Authenticate with AWS ───────────────────────────────────────
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381155823218:role/github-actions-role-raks
          aws-region: ${{ env.AWS_REGION }}

      # ── Step 2: Login to Amazon ECR ─────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Step 3: Build, tag, and push Docker image to ECR ────────────────────
      - name: Build, tag & push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
